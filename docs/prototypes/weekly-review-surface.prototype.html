<title>PROTOTYPE — The weekly review surface</title>
<!--
  PROTOTYPE — throwaway. Ticket #13, "The weekly review surface".

  Three variants of the weekly review surface, switchable via ?variant= (or the
  floating bar / arrow keys), on a throwaway page — this repo is a spec, there is
  no app to host them in yet.

    A — The week's tape      outcome-led, chronological, both books side by side, read-only
    B — Process scorecard    process-led, groupings first-class, rolling window, one book
    C — Exit workbench       excursion-led, per-Trade drilldown, carries actions, includes open Trades

  Data below is fabricated but shaped to the field list settled in #7/#8/#9 and
  deliberately kept at realistic sample size (n=3..6 per book per week).
-->
<style>
  :root {
    --ink: #16181d;
    --ink-soft: #5a606b;
    --ink-faint: #8b919c;
    --line: #e3e5ea;
    --paper: #fbfbfc;
    --card: #ffffff;
    --accent: #1f6feb;
    --accent-soft: #eaf1fe;
    --warn: #a8580a;
    --warn-soft: #fdf3e6;
    --bad: #b3261e;
    --bad-soft: #fdecea;
    --good: #17694a;
    --good-soft: #e8f4ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 36px 28px 130px; }
  header.top { border-bottom: 1px solid var(--line); padding-bottom: 22px; margin-bottom: 26px; }
  .tag {
    display: inline-block; font-size: 11px; letter-spacing: .09em; text-transform: uppercase;
    font-weight: 700; color: var(--bad); background: var(--bad-soft);
    padding: 3px 8px; border-radius: 4px; margin-bottom: 12px;
  }
  h1 { font-size: 26px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.01em; }
  h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 12px; font-weight: 700; }
  h3 { font-size: 15px; margin: 0 0 6px; }
  p { margin: 0 0 12px; max-width: 74ch; }
  .lede { color: var(--ink-soft); }
  section { margin-bottom: 30px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .card + .card { margin-top: 12px; }
  .muted { color: var(--ink-faint); }
  .soft { color: var(--ink-soft); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  .pill {
    display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 20px; background: var(--accent-soft); color: var(--accent); white-space: nowrap;
  }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.good { background: var(--good-soft); color: var(--good); }
  .pill.mute { background: #eff0f3; color: var(--ink-soft); }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; font-weight: 700; color: var(--ink-faint); font-size: 11px;
       letter-spacing: .05em; text-transform: uppercase; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 7px 8px; border-bottom: 1px solid #f0f1f4; vertical-align: top; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.thin td { color: var(--ink-faint); }
  .pos { color: var(--good); font-weight: 600; }
  .neg { color: var(--bad); font-weight: 600; }
  button {
    font: inherit; font-size: 13px; cursor: pointer; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 6px 11px;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  /* floating switcher */
  #switcher {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 4px; z-index: 99;
    background: #16181d; color: #fff; border-radius: 999px; padding: 6px 8px;
    box-shadow: 0 6px 26px rgba(0,0,0,.28); font-size: 13px;
  }
  #switcher button {
    background: transparent; border: 0; color: #fff; font-size: 15px; padding: 3px 10px; border-radius: 999px;
  }
  #switcher button:hover { background: rgba(255,255,255,.16); color: #fff; }
  #switcher .label { padding: 0 10px; white-space: nowrap; font-weight: 600; }
  #switcher .label small { font-weight: 400; opacity: .62; margin-left: 6px; }

  /* ---- A ---- */
  .books { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; align-items: start; }
  @media (max-width: 980px) { .books { grid-template-columns: 1fr; } }
  .bookhead { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 2px solid var(--ink); padding-bottom: 7px; margin-bottom: 14px; }

  .strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line);

  .strip div { background: var(--card); padding: 9px 11px; }
  .strip .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); font-weight: 700; }
  .strip .v { font-size: 19px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .tapecard { border: 1px solid var(--line); border-radius: 9px; background: var(--card); padding: 12px 14px; margin-bottom: 10px; }

  .tapecard .sym { font-weight: 700; font-size: 16px; }
  .tapecard .meta { font-size: 12px; color: var(--ink-faint); margin: 5px 0 8px; }
  .legs { font-size: 12.5px; border-left: 2px solid var(--line); padding-left: 10px; margin-left: 2px; }
  .leg { display: flex; gap: 8px; padding: 2px 0; }
  .leg .d { color: var(--ink-faint); min-width: 78px; font-variant-numeric: tabular-nums; }
  .banner { border: 1px solid #f0dcc0; background: var(--warn-soft); border-radius: 9px; padding: 13px 16px; margin-bottom: 24px; }
  .banner h2 { color: var(--warn); }
  .banner ul { margin: 0; padding-left: 18px; font-size: 13.5px; }
  .banner li { margin-bottom: 3px; }

  /* ---- B ---- */
  .meters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 8px; }
  @media (max-width: 900px) { .meters { grid-template-columns: repeat(2, 1fr); } }
  .meter { border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 14px 16px; }
  .meter .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); font-weight: 700; }
  .meter .v { font-size: 30px; font-variant-numeric: tabular-nums; line-height: 1.1; margin: 6px 0 2px; letter-spacing: -0.02em; }
  .meter .n { font-size: 11.5px; color: var(--ink-faint); }
  .bar { height: 5px; border-radius: 3px; background: #eef0f3; margin-top: 9px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .bar i.warn { background: var(--warn); }
  .bar i.good { background: var(--good); }
  .split { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 26px; align-items: start; }
  @media (max-width: 1020px) { .split { grid-template-columns: 1fr; } }
  .grouping { border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 6px 14px 10px; margin-bottom: 14px; }
  .grouping h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); margin: 12px 0 4px; }
  .rail { border: 1px dashed #c9ccd3; border-radius: 10px; background: #f6f7f9; padding: 14px 15px; }
  .rail h2 { margin-bottom: 4px; }
  .rail .note { font-size: 11.5px; color: var(--ink-faint); margin-bottom: 12px; }
  .attn { border-top: 1px solid var(--line); padding: 10px 0 2px; font-size: 12.5px; }
  .attn:first-of-type { border-top: 0; }
  .attn .t { font-weight: 600; display: block; margin-bottom: 2px; }
  .outcome-foot { display: flex; gap: 22px; flex-wrap: wrap; border-top: 1px solid var(--line);

  .outcome-foot b { font-variant-numeric: tabular-nums; color: var(--ink); }

  /* ---- C ---- */

  .tradelist { border: 1px solid var(--line); border-radius: 10px; background: var(--card); overflow: hidden; }
  .tradelist .grp { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; font-weight: 700;

  .ti { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid #f0f1f4;
        border-radius: 0; padding: 10px 13px; background: transparent; }
  .ti:hover { background: var(--accent-soft); border-color: #f0f1f4; color: inherit; }
  .ti.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .ti .s { font-weight: 700; }
  .ti .m { font-size: 11.5px; color: var(--ink-faint); }
  .timeline { display: grid; gap: 2px; margin: 6px 0 4px; }
  .tl-days { display: grid; gap: 2px; }
  .tl-cell { height: 30px; border-radius: 3px; background: #eef0f3; position: relative; }
  .tl-cell.held { background: #dbe6fb; }
  .tl-cell.mark::after {
    content: attr(data-m); position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: #fff; border-radius: 3px;
  }
  .tl-cell.entry::after { background: var(--ink); }
  .tl-cell.exit::after { background: var(--accent); }
  .tl-cell.mfe::after { background: var(--good); }
  .tl-cell.mae::after { background: var(--bad); }
  .tl-cell.sim::after { background: var(--warn); }
  .tl-axis { display: grid; gap: 2px; font-size: 9.5px; color: var(--ink-faint); text-align: center; font-variant-numeric: tabular-nums; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-soft); margin-top: 6px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 780px) { .grid2 { grid-template-columns: 1fr; } }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-size: 12.5px; }
  .kv dt { color: var(--ink-faint); }
  .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
  .qflag { font-size: 12px; color: var(--warn); background: var(--warn-soft); border: 1px solid #f0dcc0;
           border-radius: 6px; padding: 7px 10px; margin-top: 10px; }
</style>
</head>

  { kind: 'drift', sev: 'warn', title: 'AAPL (frozen 2026-06-30) — drift unacknowledged',
    body: 'ma_dist_50 recomputes to 3.9 against a snapshot of 4.4. Bar data moved; acknowledge only.', act: 'Acknowledge' },
  { kind: 'info', sev: 'mute', title: 'ANTM — 3 fields null (insufficient_history)',
    body: 'No MA200 / pct_off_52w_high. A fact about the instrument, not a fault. No action.', act: null }
];

/* ------------------------------------------------------------------ */

const closed = TRADES.filter(t => t.state === 'closed');
const open   = TRADES.filter(t => t.state === 'open');
const byBook = b => closed.filter(t => t.book === b);
const fmtR   = r => r === null || r === undefined ? '—' : (r > 0 ? '+' : '') + r.toFixed(2) + 'R';
const cls    = n => n === null || n === undefined ? 'muted' : n > 0 ? 'pos' : n < 0 ? 'neg' : '';
const sign   = n => n === null || n === undefined ? '—' : (n > 0 ? '+' : '') + n;
const px     = (t, v) => t.book === 'IDX' ? v.toLocaleString('en-US') : v.toFixed(2);
const day    = d => d.slice(5).replace('-', '/');
const REASON = { scheduled_partial: 'scheduled partial', trail_ma10: 'trail MA10', stop_hit: 'stop hit', discretionary: 'discretionary' };

/* R aggregates must declare what they excluded (#8, three-tier stop rule) */
function rAgg(ts) {
  const usable = ts.filter(t => t.realizedR !== null && t.realizedR !== undefined);
  const excluded = ts.length - usable.length;
  const sum = usable.reduce((a, t) => a + t.realizedR, 0);
  const wins = usable.filter(t => t.realizedR > 0).length;
  return {
    n: usable.length, excluded,
    sum, avg: usable.length ? sum / usable.length : null,
    winRate: usable.length ? Math.round(100 * wins / usable.length) : null, wins
  };
}

/* ================================================================== *
 * VARIANT A — The week's tape
 * outcome-led · chronological · both books side by side · read-only
 * ================================================================== */
function variantA() {
  const bookCol = (b) => {
    const ts = byBook(b).slice().sort((x, y) =>
      x.exits[x.exits.length - 1].date.localeCompare(y.exits[y.exits.length - 1].date));
    const a = rAgg(ts);
    const reg = REGIME[b];
    return `
      <div>
        <div class="bookhead">
          <h3>${b}</h3>
          <span class="pill ${b === 'US' ? 'good' : 'mute'}">${reg.label.replace('_', ' ')}</span>
        </div>
        <div class="strip">
          <div><div class="k">Closed</div><div class="v">${ts.length}</div></div>
          <div><div class="k">Net</div><div class="v ${cls(a.sum)}">${fmtR(a.sum)}</div></div>
          <div><div class="k">Win rate</div><div class="v">${a.winRate === null ? '—' : a.winRate + '%'}</div></div>
          <div><div class="k">Avg</div><div class="v ${cls(a.avg)}">${fmtR(a.avg)}</div></div>
        </div>
        <p class="muted" style="font-size:12px;margin:-8px 0 14px">
          n=${a.n}${a.excluded ? `, ${a.excluded} excluded from R (no recorded stop)` : ''} — too few to read as a rate.
        </p>
        ${ts.map(t => tapeCard(t)).join('')}
      </div>`;
  };

  const tapeCard = (t) => {
    const last = t.exits[t.exits.length - 1];
    return `
      <div class="tapecard">
        <div class="row1">
          <span class="sym">${t.sym}</span>
          <span class="${cls(t.realizedR)}" style="font-size:16px">
            ${t.realizedR === null ? `${sign(t.realizedPct)}% <span class="muted" style="font-size:11px">no R</span>` : fmtR(t.realizedR)}
          </span>
          <span class="pill mute">${t.setup.replace(/_/g, ' ')}</span>
          ${t.chased ? '<span class="pill warn">chased</span>' : ''}
          ${t.stopProv === 'reconstructed' ? '<span class="pill mute">stop reconstructed</span>' : ''}
          ${t.missingStop ? '<span class="pill bad">no stop</span>' : ''}
        </div>
        <div class="meta">
          ${day(t.entry)} → ${day(last.date)} · ${t.days}d · entry ${px(t, t.entryPx)}
          · stack ${t.stack.replace('_', ' ')} · ${t.exits.length} exit${t.exits.length > 1 ? 's' : ''}
        </div>
        <div class="legs">
          ${t.exits.map(e => `
            <div class="leg">
              <span class="d">${day(e.date)} · d${e.day}</span>
              <span>${e.qty.toLocaleString('en-US')} @ ${px(t, e.px)} — ${REASON[e.reason]}</span>
              <span class="muted mono">MFE ${e.exMfe.adr.toFixed(2)} ADR</span>
            </div>`).join('')}
        </div>
        ${t.note ? `<p class="soft" style="font-size:12.5px;margin:9px 0 0;font-style:italic">“${t.note}”</p>` : ''}
      </div>`;
  };

  return `
    <section class="banner">
      <h2>Needs attention</h2>
      <ul>
        ${ATTENTION.filter(x => x.sev !== 'mute').map(x => `<li><b>${x.title}</b> — ${x.body}</li>`).join('')}
      </ul>
    </section>

    <section>
      <h2>Week of 3–7 August 2026 · closed Trades</h2>
      <div class="books">${bookCol('US')}${bookCol('IDX')}</div>
    </section>

    <section>
      <h2>Still open — not part of this week's result</h2>
      <div class="card">
        <table>
          <thead><tr><th>Trade</th><th>Book</th><th>Entered</th><th class="num">Days</th><th class="num">Open R</th><th class="num">MA10 dist</th></tr></thead>
          <tbody>
            ${open.map(t => `<tr>
              <td><b>${t.sym}</b>${t.missingStop ? ' <span class="pill bad">no stop</span>' : ''}</td>
              <td>${t.book}</td><td>${day(t.entry)}</td>
              <td class="num">${t.live.daysHeld}</td>
              <td class="num ${cls(t.live.openR)}">${fmtR(t.live.openR)}</td>
              <td class="num">${t.live.maDist10Live.toFixed(1)} ADR</td>
            </tr>`).join('')}
          </tbody>
        </table>

}

/* ================================================================== *
 * VARIANT B — Process scorecard
 * process-led · groupings first-class · rolling window · one book at a time
 * ================================================================== */
let bState = { book: 'US', window: '12w' };

function variantB() {
  const b = bState.book;
  /* the rolling window is what makes n survivable — a strict week is n=3 */
  const pool = byBook(b);
  const a = rAgg(pool);

  const chaseable = pool.filter(t => t.stopProv === 'recorded');
  const chased = chaseable.filter(t => t.chased).length;
  const withStop = pool.filter(t => t.stop !== null).length;
  const inBand = pool.filter(t => t.adherence.partialState === 'in_band').length;
  const bandApplicable = pool.filter(t => t.adherence.partialState !== 'not_applicable').length;
  const trailOnTime = pool.filter(t => t.adherence.trailDelta === 0).length;
  const trailApplicable = pool.filter(t => t.adherence.trailDelta !== null).length;

  const meter = (k, v, n, pct, tone) => `
    <div class="meter">
      <div class="k">${k}</div>
      <div class="v">${v}</div>
      <div class="n">${n}</div>
      <div class="bar"><i class="${tone}" style="width:${pct}%"></i></div>
    </div>`;

  const group = (title, keyFn, note) => {
    const buckets = {};
    pool.forEach(t => { const k = keyFn(t); (buckets[k] = buckets[k] || []).push(t); });
    const rows = Object.entries(buckets).map(([k, ts]) => {
      const g = rAgg(ts);
      const dev = ts.map(t => t.adherence.devCost).filter(x => x !== null && x !== undefined);
      const ch = ts.filter(t => t.stopProv === 'recorded');
      return `<tr class="${ts.length < 3 ? 'thin' : ''}">
        <td>${k}${ts.length < 3 ? ' <span class="pill mute">thin</span>' : ''}</td>
        <td class="num">${ts.length}</td>
        <td class="num">${ch.length ? Math.round(100 * ch.filter(t => t.chased).length / ch.length) + '%' : '—'}</td>
        <td class="num">${dev.length ? fmtR(dev.reduce((x, y) => x + y, 0) / dev.length) : '—'}</td>
        <td class="num ${cls(g.avg)}">${fmtR(g.avg)}${g.excluded ? ` <span class="muted">(−${g.excluded})</span>` : ''}</td>
      </tr>`;
    }).join('');
    return `
      <h3>${title}</h3>
      <table>
        <thead><tr><th>${title}</th><th class="num">n</th><th class="num">Chased</th><th class="num">Dev cost</th><th class="num">Avg R</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${note ? `<p class="muted" style="font-size:11.5px;margin:6px 0 2px">${note}</p>` : ''}`;
  };

  return `
    <section>
      <div class="btnrow" style="margin-bottom:18px">
        <span class="muted" style="font-size:12px;margin-right:4px">Book</span>
        <button class="bk ${b === 'US' ? 'active' : ''}" data-bk="US">US</button>
        <button class="bk ${b === 'IDX' ? 'active' : ''}" data-bk="IDX">IDX</button>
        <span class="muted" style="font-size:12px;margin:0 4px 0 18px">Window</span>
        <button class="wn ${bState.window === '1w' ? 'active' : ''}" data-wn="1w">This week</button>
        <button class="wn ${bState.window === '12w' ? 'active' : ''}" data-wn="12w">Rolling 12w</button>
        <button class="wn ${bState.window === 'all' ? 'active' : ''}" data-wn="all">All</button>
        <span class="pill mute" style="margin-left:10px">${REGIME[b].label.replace('_', ' ')} · ${REGIME[b].detail}</span>
      </div>

      <div class="split">
        <div>
          <h2>Process — how the trades were taken</h2>
          <div class="meters">
            ${meter('Chase rate', chaseable.length ? Math.round(100 * chased / chaseable.length) + '%' : '—',
                    `${chased}/${chaseable.length} · ${pool.length - chaseable.length} excluded (stop absent or reconstructed)`,
                    chaseable.length ? 100 * chased / chaseable.length : 0, 'warn')}
            ${meter('Partial in band', bandApplicable ? `${inBand}/${bandApplicable}` : '—',
                    `${pool.length - bandApplicable} not applicable (never reached day 3)`,
                    bandApplicable ? 100 * inBand / bandApplicable : 0, 'good')}
            ${meter('Trail on signal', trailApplicable ? `${trailOnTime}/${trailApplicable}` : '—',
                    `vs nominal MA10 · median delta ${pool.map(t=>t.adherence.trailDelta).filter(x=>x!==null).sort((a,c)=>a-c)[0] ?? '—'}d`,
                    trailApplicable ? 100 * trailOnTime / trailApplicable : 0, '')}
            ${meter('Stop recorded', `${withStop}/${pool.length}`,
                    `${pool.filter(t=>t.stopProv==='reconstructed').length} reconstructed · ${pool.filter(t=>t.stop===null).length} absent`,
                    100 * withStop / pool.length, withStop === pool.length ? 'good' : 'warn')}
          </div>

          <p class="muted" style="font-size:12px;margin:14px 0 20px">
            Every rate above names its denominator and its exclusions. At this sample size a rate is a
            description of ${pool.length} Trades, not an estimate of a true rate.
          </p>

          <h2>Groupings</h2>
          <div class="grouping">
            ${group('Setup', t => t.setup.replace(/_/g, ' '))}
            ${group('Stack state at entry', t => t.stack.replace('_', ' '))}
            ${group('Chased', t => t.stopProv !== 'recorded' ? 'not measurable' : t.chased ? 'chased' : 'not chased',
                    'Trades with an absent or reconstructed stop cannot be graded for chasing (#7) and are shown as their own row rather than folded in.')}
            ${group('Exit reason (final leg)', t => REASON[t.exits[t.exits.length - 1].reason])}
          </div>

          <div class="outcome-foot">
            <span>Outcome, for the record —</span>
            <span>closed <b>${pool.length}</b></span>
            <span>net <b class="${cls(a.sum)}">${fmtR(a.sum)}</b></span>
            <span>win rate <b>${a.winRate === null ? '—' : a.winRate + '%'}</b> <span class="muted">(n=${a.n})</span></span>
            <span>avg <b class="${cls(a.avg)}">${fmtR(a.avg)}</b></span>
          </div>
        </div>

        <aside class="rail">
          <h2>Attention</h2>
          <p class="note">Always on. Not scoped to the window or the book — a 20-day stop fuse does not wait for Sunday.</p>
          ${ATTENTION.map(x => `
            <div class="attn">
              <span class="t">${x.title} <span class="pill ${x.sev}">${x.kind}</span></span>
              <span class="muted">${x.body}</span>
              ${x.act ? `<div style="margin-top:6px"><button>${x.act}</button></div>` : ''}
            </div>`).join('')}
        </aside>
      </div>
    </section>`;
}

/* ================================================================== *

 * excursion-led · per-Trade drilldown · carries actions · includes open Trades

let cSel = 'T-2026-0731-AVGO';

function variantC() {
  const t = TRADES.find(x => x.id === cSel);
  const list = (label, ts) => ts.length ? `
    <div class="grp">${label}</div>

      <button class="ti ${x.id === cSel ? 'sel' : ''}" data-id="${x.id}">

          : `<span class="muted" style="float:right">${fmtR(x.live.openR)} open</span>`}
        <span class="m">${day(x.entry)}${x.state === 'closed' ? ' → ' + day(x.exits[x.exits.length - 1].date) : ' · held ' + x.live.daysHeld + 'd'}</span>
      </button>`).join('')}` : '';

  return `
    <section class="work">

        ${list('Open', open)}
      </div>
      <div>${t.state === 'closed' ? closedDetail(t) : openDetail(t)}</div>
    </section>`;
}

function tradeDays(t) {
  const end = t.state === 'closed' ? t.exits[t.exits.length - 1].day : t.live.daysHeld;
  return Math.max(end, 6);
}

function timeline(t) {
  const n = tradeDays(t) + 2;
  const marks = {};
  marks[1] = { c: 'entry', m: 'E' };
  if (t.state === 'closed') {
    t.exits.forEach((e, i) => { marks[e.day] = { c: 'exit', m: 'X' + (t.exits.length > 1 ? (i + 1) : '') }; });
    /* the nominal variant's simulated legs, from #8 — shown against the actual */
    const sim = simLegs(t);
    sim.forEach(s => { if (!marks[s.day]) marks[s.day] = { c: 'sim', m: s.m }; });
  }
  const mfeDay = t.mfe ? dayOf(t, t.mfe.date) : null;
  const maeDay = t.mae ? dayOf(t, t.mae.date) : null;
  if (mfeDay && !marks[mfeDay]) marks[mfeDay] = { c: 'mfe', m: 'H' };
  if (maeDay && !marks[maeDay]) marks[maeDay] = { c: 'mae', m: 'L' };

  const heldTo = t.state === 'closed' ? t.exits[t.exits.length - 1].day : t.live.daysHeld;
  const cells = [], axis = [];
  for (let d = 1; d <= n; d++) {
    const mk = marks[d];
    cells.push(`<div class="tl-cell ${d <= heldTo ? 'held' : ''} ${mk ? 'mark ' + mk.c : ''}" ${mk ? `data-m="${mk.m}"` : ''}></div>`);
    axis.push(`<div>${d}</div>`);
  }
  const cols = `grid-template-columns: repeat(${n}, minmax(0,1fr));`;
  return `
    <div class="timeline">
      <div class="tl-days" style="${cols}">${cells.join('')}</div>
      <div class="tl-axis" style="${cols}">${axis.join('')}</div>
    </div>
    <div class="legend">
      <span><i style="background:#16181d"></i>entry</span>
      <span><i style="background:var(--accent)"></i>your exit</span>
      <span><i style="background:var(--warn)"></i>nominal variant would have</span>
      <span><i style="background:var(--good)"></i>high (MFE)</span>
      <span><i style="background:var(--bad)"></i>low (MAE)</span>
    </div>`;
}

function dayOf(t, date) {
  /* fabricated: trading-day index, close enough for a prototype */
  const map = {
    'T-2026-0731-AVGO': { '2026-08-03': 2, '2026-08-04': 3, '2026-08-05': 4, '2026-08-07': 6 },
    'T-2026-0803-CRWD': { '2026-08-04': 2, '2026-08-06': 4 },
    'T-2026-0721-NVDA': { '2026-07-23': 3, '2026-08-03': 9 },
    'T-2026-0728-BBCA': { '2026-07-29': 2, '2026-08-04': 5, '2026-08-05': 6, '2026-08-07': 8 },
    'T-2026-0805-ANTM': { '2026-08-05': 1, '2026-08-07': 3 }
  };
  return (map[t.id] || {})[date] || null;
}

function simLegs(t) {
  const a = t.adherence;
  const out = [];
  if (a.partialState === 'in_band' && a.partialDelta !== null) out.push({ day: 3, m: 'p' });
  if (a.trailDelta !== null && t.exits.length) {
    const actual = t.exits[t.exits.length - 1].day;
    out.push({ day: actual - a.trailDelta, m: 't' });
  }
  return out;
}

          </p>

        <div>
          <h2>Against the nominal variant — ${a.nominal}</h2>
          <dl class="kv">
            <dt>Fit</dt><dd>${a.fit === null ? '—' : a.fit.toFixed(1) + ' trading days'}</dd>

            <dt>Deviation cost</dt><dd class="${cls(a.devCost)}">${a.devCost === null ? 'not applicable' : fmtR(a.devCost)}</dd>

function openDetail(t) {
  return `

        entry ${day(t.entry)} @ ${px(t, t.entryPx)} · held ${t.live.daysHeld}d · last ${px(t, t.live.lastClose)}
      </p>
      <h2>The move so far</h2>
      ${timeline(t)}
      <div class="grid2" style="margin-top:16px">
        <dl class="kv">
          <dt>Days held</dt><dd>${t.live.daysHeld}</dd>
          <dt>Open R</dt><dd>${fmtR(t.live.openR)}</dd>
          <dt>MA10 dist (live)</dt><dd>${t.live.maDist10Live.toFixed(1)} ADR</dd>
        </dl>
        <dl class="kv">
          <dt>Stop</dt><dd>${t.stop ? px(t, t.stop) : '<span class="neg">not set</span>'}</dd>
          <dt>Setup</dt><dd>${t.setup ? t.setup.replace(/_/g, ' ') : '<span class="neg">not set</span>'}</dd>
          <dt>Regime</dt><dd>${t.regime.replace('_', ' ')}</dd>
        </dl>
      </div>
      ${t.missingStop ? '<div class="qflag">Only four fields roll daily while a Trade is open (#7). Open R needs a stop — supply one and it starts computing immediately.</div>' : ''}
      <div class="actions">
        <button>${t.stop ? 'Stop locked' : 'Add stop'}</button>
        <button>${t.setup ? 'Setup locked' : 'Add setup'}</button>
      </div>
    </div>`;
}

/* ------------------------------------------------------------------ */

const VARIANTS = {
  A: { name: "The week's tape",  render: variantA,
       blurb: 'Outcome-led and chronological. Both books side by side, closed Trades only, read-only. Attention rides as a banner on top.' },
  B: { name: 'Process scorecard', render: variantB,
       blurb: 'Process-led. Groupings are first-class axes, the window is rolling so n survives, one book at a time. Outcome is a footnote; attention is a separate always-on rail.' },
  C: { name: 'Exit workbench',   render: variantC,
       blurb: 'Excursion-led. One Trade at a time on a day-by-day timeline against the nominal variant, open Trades included, and the surface carries actions.' }
};
const KEYS = Object.keys(VARIANTS);

function current() {
  const v = new URLSearchParams(location.search).get('variant');
  return KEYS.includes(v) ? v : 'A';
}
function go(k) {
  const u = new URL(location.href);
  u.searchParams.set('variant', k);
  history.replaceState({}, '', u);
  draw();
}
function draw() {
  const k = current(), v = VARIANTS[k];
  document.getElementById('root').innerHTML = v.render();
  document.getElementById('blurb').textContent = v.blurb;
  document.getElementById('swlabel').innerHTML = `${k} <small>${v.name}</small>`;
  document.title = `PROTOTYPE — ${k}: ${v.name}`;
  wire();
}
function wire() {
  document.querySelectorAll('.bk').forEach(b => b.onclick = () => { bState.book = b.dataset.bk; draw(); });
  document.querySelectorAll('.wn').forEach(b => b.onclick = () => { bState.window = b.dataset.wn; draw(); });
  document.querySelectorAll('.ti').forEach(b => b.onclick = () => { cSel = b.dataset.id; draw(); });
}
function cycle(d) {
  const i = KEYS.indexOf(current());
  go(KEYS[(i + d + KEYS.length) % KEYS.length]);
}
document.getElementById('prev').onclick = () => cycle(-1);
document.getElementById('next').onclick = () => cycle(1);
document.addEventListener('keydown', e => {
  const t = e.target.tagName;
  if (t === 'INPUT' || t === 'TEXTAREA' || e.target.isContentEditable) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});
draw();
</script>
</body>
</html>
